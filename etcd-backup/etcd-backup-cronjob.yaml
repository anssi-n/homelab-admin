---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: etcd-backup-aws
  namespace: kube-system
spec:
  path: "aws/creds/etcd-backup-role"
  method: GET
  provider:
    server: https://vault.anyman.homelab:8200
    auth:
      kubernetes:
        mountPath: homelab-k8s
        role: external-secrets
    caBundle: 
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-backup-credentials
  namespace: kube-system
spec:
  refreshInterval: 40m

  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: etcd-backup-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_key }}"
        AWS_SESSION_TOKEN: "{{ .security_token }}"
        AGE_RECIPIENT: "{{ .age_recipient }}"

  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: etcd-backup-aws

  data:
    - secretKey: age_recipient
      remoteRef:
        key: etcd-backup
        property: AGE_PUBLIC_KEY
    - secretKey: s3_prefix
      remoteRef:
        key: etcd-backup
        property: S3_PREFIX
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: kube-system
  labels:
    app: etcd-backup
spec:
  schedule: "0 16 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: etcd-backup
        spec:
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            - key: node-role.kubernetes.io/master
              operator: Exists
              effect: NoSchedule
          hostNetwork: true
          restartPolicy: OnFailure
          serviceAccountName: etcd-backup

          containers:
            - name: backup
              image: harbor.anyman.homelab/utils/etcd-backup@sha256:8b0b45916f16faeeb40373ba817f9d289bbd699cf62eb4dfa11d5314f10ae4f7
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: etcd-backup-credentials
              env:
                - name: ETCDCTL_API
                  value: "3"
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -euo pipefail
                  TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
                  RAW="/tmp/etcd-${TIMESTAMP}-${NODE_NAME}.db"
                  COMP="${RAW}.zst"
                  ENC="${COMP}.age"

                  echo "=== Taking snapshot on ${NODE_NAME} ==="
                  etcdctl snapshot save "${RAW}" \
                    --endpoints=https://127.0.0.1:2379 \
                    --cacert=/etc/kubernetes/pki/etcd/ca.crt \
                    --cert=/etc/kubernetes/pki/etcd/server.crt \
                    --key=/etc/kubernetes/pki/etcd/server.key

                  echo "=== Verifying snapshot ==="
                  etcdutl snapshot status "${RAW}" --write-out=table

                  echo "=== Compressing snapshot with zstd ==="
                  zstd -T0 -c "${RAW}" > "${COMP}"
                  rm -f "${RAW}"

                  echo "=== Encrypt etcd snapshot ==="
                  age -r "${AGE_RECIPIENT}" -o "${ENC}" "${COMP}"
                  rm -f "${COMP}"       

                  echo "=== Uploading encrypted snapshot ==="
                  aws s3 cp "${ENC}" "${S3_PREFIX}/" --only-show-errors
                  rm -f "${ENC}" 

                  echo "=== Backup /etc/kubernetes directory ==="
                  K8S_TAR="/tmp/kubernetes-${TIMESTAMP}-${NODE_NAME}.tar.gz"
                  tar -czpf "${K8S_TAR}" --exclude='etc/kubernetes/tmp' -C / etc/kubernetes

                  echo "=== Encrypt /etc/kubernetes archive ==="
                  age -r "${AGE_RECIPIENT}" -o "${K8S_TAR}.age" "${K8S_TAR}"
                  rm -f "${K8S_TAR}"

                  echo "=== Uploading encrypted snapshot ==="
                  aws s3 cp "${K8S_TAR}.age" "${S3_PREFIX}/" --only-show-errors
                  rm -f "${K8S_TAR}.age"

                  echo "=== Backup completed successfully ==="
              volumeMounts:
                - name: etcd-certs
                  mountPath: /etc/kubernetes/pki/etcd
                  readOnly: true
                - name: kubernetes-dir
                  mountPath: /etc/kubernetes
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]

          volumes:
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/pki/etcd
                type: Directory
            - name: kubernetes-dir
              hostPath:
                path: /etc/kubernetes
                type: Directory
            - name: tmp
              emptyDir: {}
