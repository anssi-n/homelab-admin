---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: etcd-backup-aws
  namespace: kube-system
spec:
  path: "aws/creds/etcd-backup-role"
  method: GET
  provider:
    server: https://vault.anyman.homelab:8200
    auth:
      kubernetes:
        mountPath: homelab-k8s
        role: external-secrets
    caBundle: 
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: etcd-backup-credentials
  namespace: kube-system
spec:
  refreshInterval: 40m

  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore

  target:
    name: etcd-backup-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AWS_ACCESS_KEY_ID: "{{ .access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ .secret_key }}"
        AWS_SESSION_TOKEN: "{{ .security_token }}"
        AGE_RECIPIENT: "{{ .age_recipient }}"
        AGE_IDENTITY: "{{ .age_identity }}"
        S3_PREFIX: "{{ .s3_prefix }}"

  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: etcd-backup-aws

  data:
    - secretKey: age_identity
      remoteRef:
        key: etcd-backup
        property: AGE_PRIVATE_KEY
    - secretKey: age_recipient
      remoteRef:
        key: etcd-backup
        property: AGE_PUBLIC_KEY
    - secretKey: s3_prefix
      remoteRef:
        key: etcd-backup
        property: S3_PREFIX
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: kube-system
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: kube-system
  labels:
    app: etcd-backup
spec:
  schedule: "0 18 * * *"
  timeZone: Europe/Helsinki
  startingDeadlineSeconds: 3600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: etcd-backup
        spec:
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
            - key: node-role.kubernetes.io/master
              operator: Exists
              effect: NoSchedule
          hostNetwork: true
          restartPolicy: OnFailure
          serviceAccountName: etcd-backup

          containers:
            - name: backup
              image: harbor.anyman.homelab/utils/etcd-backup@sha256:0972b0f9ef2c298384f3b240c13be388a58a82b68aef4e563868b4edd57ec262
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: etcd-backup-credentials
              env:
                - name: PUSHGATEWAY
                  value: push-gateway-prometheus-pushgateway.monitoring.svc.cluster.local:9091
                - name: ETCDCTL_API
                  value: "3"
                - name: NODE_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: spec.nodeName
              command: ["/bin/sh", "-c"]
              args:
                - |

                  set -euo pipefail

                  : "${S3_PREFIX:?S3_PREFIX must be set (e.g. s3://bucket/etcd)}"
                  : "${AGE_RECIPIENT:?AGE_RECIPIENT must be set}"
                  : "${PUSHGATEWAY:?PUSHGATEWAY must be set}"

                  START=$(date -u +%s)
                  TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
                  RAW="/tmp/etcd-${TIMESTAMP}-${NODE_NAME}.db"
                  COMP="${RAW}.zst"
                  ENC="${COMP}.age"

                  S3_URI="${S3_PREFIX%/}"
                  BUCKET="${S3_URI#s3://}"
                  BUCKET="${BUCKET%%/*}"
                  PREFIX="${S3_URI#s3://"$BUCKET"}"
                  PREFIX="${PREFIX#/}"
                  [ -n "$BUCKET" ] || { echo "cannot parse bucket from S3_PREFIX=$S3_PREFIX"; exit 1; }

                  verify() {
                    local n r
                    n=$(wc -c < "$1")
                    r=$(aws s3api head-object --bucket "$BUCKET" --key "$2" \
                          --query ContentLength --output text)
                    [ "$n" -eq "$r" ] || {
                      echo "size mismatch for s3://$BUCKET/$2: local=$n remote=$r"
                      return 1
                    }
                    printf '%s' "$n"
                  }

                  echo "=== Tools ==="
                  etcd --version
                  etcdctl version
                  etcdutl version
                  echo "bucket=$BUCKET prefix=${PREFIX:-<bucket-root>} node=$NODE_NAME"

                  echo "=== Taking snapshot on ${NODE_NAME} ==="
                  SNAP_START=$(date -u +%s)
                  etcdctl snapshot save "${RAW}" \
                    --endpoints=https://127.0.0.1:2379 \
                    --cacert=/etc/kubernetes/pki/etcd/ca.crt \
                    --cert=/etc/kubernetes/pki/etcd/server.crt \
                    --key=/etc/kubernetes/pki/etcd/server.key
                  SNAP_SECONDS=$(( $(date -u +%s) - SNAP_START ))

                  echo "=== Inspecting snapshot ==="
                  SNAP_JSON=$(etcdutl snapshot status "${RAW}" -w json)
                  SNAP_REV=$(printf '%s' "$SNAP_JSON"   | jq -er '.revision  // .[0].revision')
                  SNAP_KEYS=$(printf '%s' "$SNAP_JSON"  | jq -er '.totalKey  // .[0].totalKey')
                  SNAP_BYTES=$(printf '%s' "$SNAP_JSON" | jq -er '.totalSize // .[0].totalSize')
                  ETCD_VER=$(printf '%s' "$SNAP_JSON"   | jq -er '.version   // .[0].version')
                  echo "snapshot: revision=${SNAP_REV} keys=${SNAP_KEYS} raw_bytes=${SNAP_BYTES} etcd=${ETCD_VER} save_seconds=${SNAP_SECONDS}"
                  [ "$SNAP_KEYS" -gt 0 ] || { echo "snapshot reports 0 keys - refusing to upload"; exit 1; }

                  echo "=== Live cluster state ==="
                  STATUS_JSON=$(etcdctl endpoint status -w json \
                    --endpoints=https://127.0.0.1:2379 \
                    --cacert=/etc/kubernetes/pki/etcd/ca.crt \
                    --cert=/etc/kubernetes/pki/etcd/server.crt \
                    --key=/etc/kubernetes/pki/etcd/server.key)
                  LIVE_REV=$(printf '%s' "$STATUS_JSON"       | jq -er '.[0].Status.header.revision')
                  LIVE_DB=$(printf '%s' "$STATUS_JSON"        | jq -er '.[0].Status.dbSize')
                  LIVE_DB_IN_USE=$(printf '%s' "$STATUS_JSON" | jq -er '.[0].Status.dbSizeInUse')
                  echo "cluster: revision=${LIVE_REV} dbSize=${LIVE_DB} dbSizeInUse=${LIVE_DB_IN_USE}"

                  echo "=== Compressing snapshot with zstd ==="
                  zstd -T0 -c "${RAW}" > "${COMP}"
                  rm -f "${RAW}"

                  echo "=== Encrypt etcd snapshot ==="
                  age -r "${AGE_RECIPIENT}" -o "${ENC}" "${COMP}"
                  rm -f "${COMP}"

                  echo "=== Uploading encrypted snapshot ==="
                  aws s3 cp "${ENC}" "${S3_PREFIX}/" --only-show-errors
                  DB_KEY="${PREFIX:+$PREFIX/}${ENC##*/}"
                  DB_BYTES=$(verify "${ENC}" "${DB_KEY}")
                  rm -f "${ENC}"
                  echo "stored s3://${BUCKET}/${DB_KEY} (${DB_BYTES} bytes)"

                  echo "=== Backup /etc/kubernetes directory ==="
                  K8S_TAR="/tmp/kubernetes-${TIMESTAMP}-${NODE_NAME}.tar.gz"
                  K8S_ENC="${K8S_TAR}.age"
                  tar -czpf "${K8S_TAR}" --exclude='etc/kubernetes/tmp' -C / etc/kubernetes
                  K8S_FILES=$(tar -tzf "${K8S_TAR}" | grep -c . || true)
                  tar -tzf "${K8S_TAR}" | grep -qx 'etc/kubernetes/pki/etcd/server.crt' || {
                    echo "archive is missing etc/kubernetes/pki/etcd/server.crt"
                    exit 1
                  }
                  echo "archive: files=${K8S_FILES}"

                  echo "=== Encrypt /etc/kubernetes archive ==="
                  age -r "${AGE_RECIPIENT}" -o "${K8S_ENC}" "${K8S_TAR}"
                  rm -f "${K8S_TAR}"

                  echo "=== Uploading encrypted archive ==="
                  aws s3 cp "${K8S_ENC}" "${S3_PREFIX}/" --only-show-errors
                  K8S_KEY="${PREFIX:+$PREFIX/}${K8S_ENC##*/}"
                  K8S_BYTES=$(verify "${K8S_ENC}" "${K8S_KEY}")
                  rm -f "${K8S_ENC}"
                  echo "stored s3://${BUCKET}/${K8S_KEY} (${K8S_BYTES} bytes)"

                  echo "=== Reporting to pushgateway ==="
                  END=$(date -u +%s)
                  printf '%s\n' \
                    "etcd_backup_last_success_timestamp_seconds ${END}" \
                    "etcd_backup_duration_seconds $(( END - START ))" \
                    "etcd_backup_snapshot_duration_seconds ${SNAP_SECONDS}" \
                    "etcd_backup_snapshot_revision ${SNAP_REV}" \
                    "etcd_backup_snapshot_keys ${SNAP_KEYS}" \
                    "etcd_backup_snapshot_raw_bytes ${SNAP_BYTES}" \
                    "etcd_backup_snapshot_object_bytes ${DB_BYTES}" \
                    "etcd_backup_kubernetes_files ${K8S_FILES}" \
                    "etcd_backup_kubernetes_object_bytes ${K8S_BYTES}" \
                    "etcd_backup_cluster_revision ${LIVE_REV}" \
                    "etcd_backup_cluster_dbsize_bytes ${LIVE_DB}" \
                    "etcd_backup_cluster_dbsize_in_use_bytes ${LIVE_DB_IN_USE}" \
                    "etcd_backup_etcd_version_info{version=\"${ETCD_VER}\"} 1" \
                    | curl -fsS --retry 3 --max-time 15 --data-binary @- \
                        "http://${PUSHGATEWAY}/metrics/job/etcd-backup"

                  echo "=== Backup completed successfully ==="
              volumeMounts:
                - name: etcd-certs
                  mountPath: /etc/kubernetes/pki/etcd
                  readOnly: true
                - name: kubernetes-dir
                  mountPath: /etc/kubernetes
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]

          volumes:
            - name: etcd-certs
              hostPath:
                path: /etc/kubernetes/pki/etcd
                type: Directory
            - name: kubernetes-dir
              hostPath:
                path: /etc/kubernetes
                type: Directory
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
